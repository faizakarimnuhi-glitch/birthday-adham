<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday 🎂</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      overflow-x: hidden;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      text-align: center;
      background: rgba(255, 255, 255, 0.92);
      padding: 35px 25px;
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
      position: relative;
      z-index: 2;
    }

    .emoji {
      font-size: 65px;
      animation: bounce 2s infinite;
    }

    h1 {
      color: #e84393;
      font-size: clamp(28px, 8vw, 42px);
      margin: 15px 0;
    }

    h2 {
      color: #6c5ce7;
      font-size: clamp(20px, 5vw, 28px);
      margin-bottom: 15px;
    }

    p {
      color: #555;
      font-size: 16px;
      line-height: 1.8;
    }

    .cake {
      font-size: 75px;
      margin: 20px 0;
      animation: float 3s ease-in-out infinite;
    }

    button {
      border: none;
      background: linear-gradient(135deg, #e84393, #6c5ce7);
      color: white;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 25px;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(108, 92, 231, 0.4);
    }

    #message {
      display: none;
      margin-top: 25px;
      padding: 20px;
      background: #fff0f6;
      border-radius: 15px;
      color: #d63384;
      font-size: 16px;
      line-height: 1.8;
      animation: fadeIn 1s ease;
    }

    .balloon {
      position: fixed;
      bottom: -120px;
      width: 55px;
      height: 70px;
      border-radius: 50%;
      animation: rise 12s linear infinite;
      z-index: 1;
    }

    .balloon::after {
      content: "";
      position: absolute;
      width: 2px;
      height: 70px;
      background: #777;
      top: 68px;
      left: 50%;
    }

    .balloon:nth-child(1) {
      left: 8%;
      background: #ff7675;
      animation-delay: 0s;
    }

    .balloon:nth-child(2) {
      left: 30%;
      background: #74b9ff;
      animation-delay: 3s;
    }

    .balloon:nth-child(3) {
      left: 60%;
      background: #ffeaa7;
      animation-delay: 5s;
    }

    .balloon:nth-child(4) {
      left: 85%;
      background: #a29bfe;
      animation-delay: 7s;
    }

    @keyframes rise {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translateY(-120vh) rotate(20deg);
        opacity: 0;
      }
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-12px);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 400px) {
      .container {
        padding: 30px 18px;
      }

      p {
        font-size: 14px;
      }

      .emoji {
        font-size: 55px;
      }

      .cake {
        font-size: 65px;
      }
    }
  </style>
</head>

<body>

  <!-- Animated balloons -->
  <div class="balloon"></div>
  <div class="balloon"></div>
  <div class="balloon"></div>
  <div class="balloon"></div>

  <div class="container">
    <div class="emoji">🎉</div>

    <!-- Change the name here -->
    <h1>Happy Birthday!</h1>
    <h2>Dear Adham 💖</h2>

    <div class="cake">🎂</div>

    <p>
      Wishing you a day filled with love, happiness,
      laughter, and beautiful memories.
    </p>

    <button onclick="showWish()">Open Your Special Wish 💌</button>

    <div id="message">
      May all your dreams come true and every day
      bring you something wonderful.

      <br><br>

      You deserve all the happiness in the world.
      Happy Birthday once again! 🥳💝
    </div>
  </div>

  <script>
    function showWish() {
      const message = document.getElementById("message");

      message.style.display = "block";

      // Simple confetti effect
      for (let i = 0; i < 50; i++) {
        const confetti = document.createElement("div");

        confetti.style.position = "fixed";
        confetti.style.width = "8px";
        confetti.style.height = "8px";
        confetti.style.background =
          ["#ff7675", "#74b9ff", "#ffeaa7", "#a29bfe"][
            Math.floor(Math.random() * 4)
          ];

        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.top = "-10px";
        confetti.style.zIndex = "10";

        document.body.appendChild(confetti);

        confetti.animate(
          [
            { transform: "translateY(0) rotate(0deg)" },
            { transform: "translateY(110vh) rotate(720deg)" }
          ],
          {
            duration: 2500 + Math.random() * 2000,
            easing: "linear"
          }
        );

        setTimeout(() => confetti.remove(), 4500);
      }
    }
  </script>

</body>
</html>
